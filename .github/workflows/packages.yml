name: Packages

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            package: windows
          - os: ubuntu-24.04
            package: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install Linux Qt runtime dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends dpkg-dev libegl1 libgl1 libopengl0 libfontconfig1 libdbus-1-3 libx11-xcb1 libxkbcommon0 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-render-util0 libxcb-randr0 libxcb-shape0 libxcb-shm0 libxcb-xfixes0 libxcb-xinerama0 libxcb-xkb1
      - name: Install build dependencies and bundle phone app
        run: |
          python -m pip install -e ".[desktop]" "PyInstaller>=6.12,<7"
          npm ci --prefix web
          npm run build --prefix web
      - name: Build frozen desktop app
        run: |
          python -m PyInstaller --clean --noconfirm packaging/desktop.spec
      - name: Create Windows per-user installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          $version = python -c "from duet import __version__; print(__version__)"
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$version" packaging/duet.iss
      - name: Install and smoke-test Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installer = (Get-ChildItem "dist/installer/Duet-Setup-*-win64.exe" | Select-Object -First 1).FullName
          if (-not $installer) { throw "Inno Setup did not create the installer" }
          $target = Join-Path $env:RUNNER_TEMP "DuetInstalled"
          $install = Start-Process -FilePath $installer -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/CURRENTUSER", "/DIR=$target" -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "Installer exited with $($install.ExitCode)" }
          if (-not (Test-Path (Join-Path $target "duet-desktop.exe"))) { throw "Desktop executable was not installed" }
          $env:QT_QPA_PLATFORM = "offscreen"
          $smoke = Start-Process -FilePath (Join-Path $target "duet-desktop.exe") -ArgumentList "--smoke-test" -PassThru
          if (-not $smoke.WaitForExit(30000)) { Stop-Process -Id $smoke.Id -Force; throw "Packaged Qt smoke test timed out" }
          if ($smoke.ExitCode -ne 0) { throw "Packaged Qt smoke test exited with $($smoke.ExitCode)" }
      - name: Build and install Linux package, then smoke-test
        if: runner.os == 'Linux'
        run: |
          chmod +x packaging/build_deb.sh
          packaging/build_deb.sh
          version="$(python -c 'from duet import __version__; print(__version__)')"
          sudo apt-get install -y "./dist/duet_${version}_amd64.deb"
          QT_QPA_PLATFORM=offscreen /usr/bin/duet-desktop --smoke-test
      - uses: actions/upload-artifact@v4
        with:
          name: duet-${{ matrix.package }}-package
          path: |
            dist/installer/*.exe
            dist/*.deb
          if-no-files-found: error
