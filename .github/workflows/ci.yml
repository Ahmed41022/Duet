name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  checks:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install editable package
        run: python -m pip install -e ".[dev]"
      - name: Lint and test
        run: |
          python -m ruff check .
          python -m ruff format --check .
          duet --version
          python -m pytest -q
      - name: Build the web bundle and Python distributions
        run: |
          npm ci --prefix web
          npm run build --prefix web
          python -m build
      - name: Check the installed wheel
        run: |
          python -m pip uninstall -y duet
          python -m pip install dist/*.whl
          duet --version
          python - <<'PY'
          import re
          from importlib.resources import files

          static = files("duet.server").joinpath("static")
          html = static.joinpath("index.html").read_text(encoding="utf-8")
          assets = re.findall(r'(?:src|href)="\./(assets/[^"]+)"', html)
          assert "<title>Duet</title>" in html
          assert any(asset.endswith(".css") for asset in assets)
          assert any(asset.endswith(".js") for asset in assets)
          assert all(static.joinpath(*asset.split("/")).read_bytes() for asset in assets)
          PY
